[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-ml-seq-tools"
version = "0.1.0"
description = "JAX/Flax tools for DNA sequence classification (CNN + Transformer)."
requires-python = ">=3.11"
dependencies = [
    "flax==0.10.4",
    "jax==0.5.1",
    "matplotlib==3.10.1",
    "numpy==1.26.4",
    "optax==0.2.4",
    "orbax-checkpoint==0.11.9",
    "pandas==2.2.2",
    "scikit-learn==1.4.2",
    "seaborn==0.13.2",
    "tensorflow==2.21.0",
    "tqdm==4.67.3",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "pytest",
    "requests>=2.34.2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
